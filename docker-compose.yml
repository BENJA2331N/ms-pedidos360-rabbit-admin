services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: pedidos360-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pedidos360-net

  ms-catalogo:
    build:
      context: ../ms-pedidos360-catalogo
      dockerfile: Dockerfile
    container_name: pedidos360-catalogo
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_URL: ${CATALOG_DB_URL:-jdbc:h2:mem:catalogo_db;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
      DB_USER: ${CATALOG_DB_USER:-sa}
      DB_PASSWORD: ${CATALOG_DB_PASS:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pedidos360-net

  ms-ordenes:
    build:
      context: ../ms-pedidos360-ordenes
      dockerfile: Dockerfile
    container_name: pedidos360-ordenes
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_URL: ${ORDERS_DB_URL:-jdbc:h2:mem:ordenes_db;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
      DB_USER: ${ORDERS_DB_USER:-sa}
      DB_PASSWORD: ${ORDERS_DB_PASS:-}
      CATALOG_SERVICE_URL: http://ms-catalogo:8081
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
      ms-catalogo:
        condition: service_started
    networks:
      - pedidos360-net

  ms-rabbit-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pedidos360-rabbit-admin
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pedidos360-net

  ms-bff:
    build:
      context: ../ms-pedidos360-bff
      dockerfile: Dockerfile
    container_name: pedidos360-bff
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      CATALOG_SERVICE_URL: http://ms-catalogo:8081
      ORDERS_SERVICE_URL: http://ms-ordenes:8082
      RABBIT_ADMIN_URL: http://ms-rabbit-admin:8083
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4200
    depends_on:
      - ms-catalogo
      - ms-ordenes
      - ms-rabbit-admin
    networks:
      - pedidos360-net

  frontend:
    build:
      context: ../../frontCloud
      dockerfile: Dockerfile
    container_name: pedidos360-frontend
    ports:
      - "5173:80"
    depends_on:
      - ms-bff
    networks:
      - pedidos360-net

networks:
  pedidos360-net:
    driver: bridge