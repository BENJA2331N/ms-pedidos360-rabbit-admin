server:
  port: ${SERVER_PORT:8083}
  address: 0.0.0.0
  forward-headers-strategy: framework

spring:
  application:
    name: ms-pedidos360-rabbit-admin
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
